<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Конвертер текста в азбуку Морзе</title>
  </head>
  <body>
    <h1>Конвертер текста в азбуку Морзе</h1>
    <p>Загрузите файл с текстом или азбукой Морзе для конвертации</p>
    
    <form
      enctype="multipart/form-data"
      action="/upload"
      method="post"
    >
      <input type="file" name="myFile" />
      <input type="submit" value="Загрузить и конвертировать" />
    </form>
  </body>
</html>
